[project]
name = "projectlibre-mcp"
version = "0.1.0"
description = "MCP server para leer/crear/editar proyectos de ProjectLibre vía MPXJ"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2.0",
    "mpxj==16.3.0",
    "JPype1>=1.7.1",
]

[project.scripts]
projectlibre-mcp = "projectlibre_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projectlibre_mcp"]

[tool.pytest.ini_options]
# La JVM (HotSpot) usa SIGSEGV de forma deliberada en Windows; faulthandler de
# pytest lo reporta como "Windows fatal exception: access violation" (falso positivo).
# Desactivarlo deja el output de los tests limpio sin ocultar errores reales de Python.
addopts = "-p no:faulthandler"
